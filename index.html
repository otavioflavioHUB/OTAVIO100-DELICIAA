<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visor de Movimentações</title><style>*{box-sizing:border-box}body{margin:0;background:#101620;display:grid;place-items:center;min-height:100dvh;font-family:Arial,sans-serif}.visor{width:min(170px,100vw);padding:8px;border:1px solid #64748b70;border-radius:14px;background:linear-gradient(145deg,#202c3b,#101620);display:grid;gap:8px}.bloco{min-width:0;height:82px;border:1px solid var(--c);border-left:3px solid var(--c);border-radius:9px;padding:10px 5px;text-align:center;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 17%,transparent),transparent);color:var(--c)}.rotulo{font-size:13px;font-weight:900;letter-spacing:1px}.valor{font-size:32px;font-weight:900;white-space:nowrap;margin-top:5px;font-variant-numeric:tabular-nums}.visor.erro{border-color:#eab477}</style><main class="visor" id="visor" aria-label="Visor de movimentações"><section class="bloco" style="--c:#79C8ED"><div class="rotulo">↙ ENTRADA</div><div class="valor" id="entrada">—</div></section><section class="bloco" style="--c:#EAB477"><div class="rotulo">↗ SAÍDA</div><div class="valor" id="saida">—</div></section><section class="bloco" id="resultado" style="--c:#B0B8C5"><div class="rotulo">DIFERENÇA</div><div class="valor" id="diferenca">—</div></section></main><script>const fmt=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});const $=id=>document.getElementById(id);function ajustar(){document.querySelectorAll('.valor').forEach(el=>{let n=32;el.style.fontSize=n+'px';while(el.scrollWidth>el.clientWidth&&n>8)el.style.fontSize=--n+'px'})}function mostrar(d){if(!Number.isSafeInteger(d.entrada)||!Number.isSafeInteger(d.saida)||d.entrada<0||d.saida<0)throw Error('Dados inválidos');let v=d.entrada-d.saida;$('entrada').textContent=fmt.format(d.entrada);$('saida').textContent=fmt.format(d.saida);$('diferenca').textContent=(v>0?'+':'')+fmt.format(v);$('resultado').style.setProperty('--c',v>0?'#58CBA2':v<0?'#E56B73':'#B0B8C5');ajustar()}async function atualizar(){try{const r=await fetch('./dados.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP');mostrar(await r.json());$('visor').classList.remove('erro');$('visor').title='Dados atualizados'}catch(e){$('visor').classList.add('erro');$('visor').title='Dados indisponíveis ou desatualizados'}}window.addEventListener('resize',ajustar);atualizar();setInterval(atualizar,60000);</script></html>
